<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#064E3B" />
<title>Tidak ada koneksi · PURA</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF9F6; color: #17212B;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  .card { max-width: 380px; }
  .icon { width: 88px; height: 88px; border-radius: 24px; margin: 0 auto 24px; display: block; }
  h1 { color: #064E3B; font-size: 24px; margin: 0 0 8px; }
  p { color: #5F6B7A; font-size: 17px; line-height: 1.5; margin: 0 0 24px; }
  button { background: #087F6D; color: #fff; border: 0; border-radius: 16px; padding: 16px 28px; font-size: 17px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="/icons/icon-192.png" alt="" />
    <h1>Tidak ada koneksi internet</h1>
    <p>PURA perlu internet agar data kas selalu sama di semua perangkat. Periksa sinyal atau Wi-Fi Anda, lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
